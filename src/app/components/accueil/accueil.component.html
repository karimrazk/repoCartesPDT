<div class="container-fluid ">
  <div class=" py-4  ">
    <div class="row">


      <!-- MAP -->
      <div class="col-lg-7 col-sm-12">
        <div class="card">
          <div class="card-header headercard">
            <h6 class="mb-0">Carte Interactive des Provinces</h6>
          </div>

          <div class="card-body">
            <iframe [src]="mapUrl" width="100%" height="600" class="border border-1">
            </iframe>
          </div>
        </div>
      </div>

      <!-- INFO -->
      <div class="col-lg-5 col-sm-12 ">
        <div class="card">
          <div class="card-header headercard">
            <h6 class="mb-0">Informations</h6>
          </div>

          <div class="card-body">
            <ng-container *ngIf="selected; else empty">
              <h6>{{ selected.type }}</h6>
              <p *ngIf="selected.nomFr"><b>Nom (FR):</b> {{ selected.nomFr }}</p>
              <p *ngIf="selected.nomAr"><b>Nom (AR):</b> {{ selected.nomAr }}</p>
              <p *ngIf="selected.chefLieu"><b>Chef-lieu:</b> {{ selected.chefLieu }}</p>
              <div class="justify-content-end d-flex">
                <a *ngIf="selected.type == 'Province'" class="btn btn-outline-primary btn-sm"
                  [routerLink]=" ['/communes']" routerlinkactive="router-link-active">
                  Voir Détails
                </a>

              </div>


            </ng-container>

            <ng-template #empty>
              <p>
                Cette section affiche des informations détaillées sur la province sélectionnée
                dans la carte interactive.
              </p>
            </ng-template>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
