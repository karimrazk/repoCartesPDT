<!doctype html>
<html lang="en">

  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">

    <link rel="stylesheet" href="css/leaflet.css">
    <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
    <link rel="stylesheet" href="css/qgis2web.css">

    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }

    </style>
  </head>

  <body>
    <div id="map"></div>

    <script src="js/leaflet.js"></script>
    <script src="js/multi-style-layer.js"></script>
    <script src="js/leaflet-hash.js"></script>
    <script src="data/bdt_commune_geom_0.js"></script>

    <script>

      /* ================== MAP ================== */
      var map = L.map('map', {
        zoomControl: true, maxZoom: 28, minZoom: 8
      }).fitBounds([
        [27.979466190326487, -11.762216826539563],
        [29.963944020061643, -8.268459924490768]
      ]);



      /* ================== STYLES ================== */

      // Style normal
      var normalStyle = {
        color: '#232323',
        weight: 1,
        fillColor: '#10d0a5',
        fillOpacity: 1
      };

      // Style sélectionné
      var selectedStyle = {
        color: '#ff0000',
        weight: 2,
        fillColor: '#ffcc00',
        fillOpacity: 0.8
      };

      var selectedLayer = null;

      /* ================== POPUP + CLICK ================== */

      function pop_bdt_commune_geom_0(feature, layer) {

        var popupContent = `
        <table>
          <tr>
            <td><b>Commune :</b></td>
            <td>${feature.properties['bdt_commune_commune_fr'] || ''}</td>
          </tr>
          <tr>
            <td><b>Milieu :</b></td>
            <td>${feature.properties['bdt_commune_milieu'] || ''}</td>
          </tr>
        </table>
      `;

        layer.bindPopup(popupContent);

        layer.on('click', function () {

          // Réinitialiser ancienne sélection
          if (selectedLayer) {
            selectedLayer.setStyle(normalStyle);
          }

          // Appliquer nouveau style
          layer.setStyle(selectedStyle);
          selectedLayer = layer;

          // Envoi vers Angular / parent
          window.parent.postMessage({
            action: 'communeInfo',
            nomFr: feature.properties['bdt_commune_commune_fr'],
            id: feature.properties['bdt_commune_id']
          }, '*');
          // ✅ ZOOM AUTOMATIQUE SUR LA RÉGION
          map.fitBounds(layer.getBounds(), {
            padding: [0, 30],
            animate: true,
            duration: 0.8,
            maxZoom: 9
          });

        });

        // Tooltip permanent
        layer.bindTooltip(
          feature.properties['bdt_commune_commune_fr'],
          { permanent: true, direction: 'center', className: 'label-commune' }
        );
      }

      /* ================== MULTI STYLE ================== */

      function style_0() {
        return {
          color: '#30123b',
          weight: 1,
          fillOpacity: 0
        };
      }

      function style_1() {
        return normalStyle;
      }

      /* ================== LAYER ================== */

      var layer_bdt_commune_geom_0 = new L.geoJson.multiStyle(
        json_bdt_commune_geom_0,
        {
          onEachFeature: pop_bdt_commune_geom_0,
          styles: [style_0, style_1]
        }
      );

      map.addLayer(layer_bdt_commune_geom_0);

    </script>
  </body>

</html>
