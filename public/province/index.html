<!doctype html>
<html lang="en">

  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="css/leaflet.css">
    <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
    <link rel="stylesheet" href="css/qgis2web.css">
    <link rel="stylesheet" href="css/fontawesome-all.min.css">
    <link rel="stylesheet" href="css/leaflet.photon.css">
    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        padding: 0;
        margin: 0;
      }

    </style>
    <title></title>
  </head>

  <body>
    <div id="map">
    </div>
    <script src="js/qgis2web_expressions.js"></script>
    <script src="js/leaflet.js"></script>
    <script src="js/L.Control.Layers.Tree.min.js"></script>
    <script src="js/leaflet.rotatedMarker.js"></script>
    <script src="js/leaflet.pattern.js"></script>
    <script src="js/leaflet-hash.js"></script>
    <script src="js/Autolinker.min.js"></script>
    <script src="js/rbush.min.js"></script>
    <script src="js/labelgun.min.js"></script>
    <script src="js/labels.js"></script>
    <script src="js/leaflet.photon.js"></script>
    <script src="data/bdt_region_geom_0.js"></script>
    <script src="data/bdt_province_geom_1.js"></script>
    <script>
      // Style normal REGION
      var normalStyleRegion = {
        color: 'rgba(35,35,35,1.0)',
        weight: 1,
        fillColor: 'rgba(243,164,87,1.0)',
        fillOpacity: 1
      };

      // Style normal PROVINCE
      var normalStyleProvince = {
        color: 'rgba(35,35,35,1.0)',
        weight: 1,
        fillColor: 'rgba(212,212,212,1.0)',
        fillOpacity: 1
      };

      // Style sélectionné
      var selectedStyle = {
        color: '#ff0000',
        weight: 2,
        fillColor: '#00deff',
        fillOpacity: 0.8
      };

      // Style sélectionné region
      var selectedStyleRegion = {
        color: '#ff0000',
        weight: 2,
        fillColor: 'rgba(212,212,212,1.0)',
        fillOpacity: 0.8
      };

      var selectedLayerRegion = null;
      var selectedLayerProvince = null;

      var map = L.map('map', {
        zoomControl: false, maxZoom: 28, minZoom: 7
      }).fitBounds(
        [[26.18891065180228, -14.042455196874704], [31.305759064137582, -5.034027796242219]]
        ,
        {
          padding: [150, 150]
        }
      );
      var hash = new L.Hash(map);
      map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
      var autolinker = new Autolinker({ truncate: { length: 60, location: 'smart' } });
      // remove popup's row if "visible-with-data"
      function removeEmptyRowsFromPopupContent(content, feature) {
        var tempDiv = document.createElement('div');
        tempDiv.innerHTML = content;
        var rows = tempDiv.querySelectorAll('tr');
        for (var i = 0; i < rows.length; i++) {
          var td = rows[i].querySelector('td.visible-with-data');
          var key = td ? td.id : '';
          if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
            rows[i].parentNode.removeChild(rows[i]);
          }
        }
        return tempDiv.innerHTML;
      }
      // modify popup if contains media
      function addClassToPopupIfMedia(content, popup) {
        var tempDiv = document.createElement('div');
        tempDiv.innerHTML = content;
        var imgTd = tempDiv.querySelector('td img');
        if (imgTd) {
          var src = imgTd.getAttribute('src');
          if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
            popup._contentNode.classList.add('media');
            setTimeout(function () {
              popup.update();
            }, 10);
          } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
            var audio = document.createElement('audio');
            audio.controls = true;
            audio.src = src;
            imgTd.parentNode.replaceChild(audio, imgTd);
            popup._contentNode.classList.add('media');
            setTimeout(function () {
              popup.setContent(tempDiv.innerHTML);
              popup.update();
            }, 10);
          } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
            var video = document.createElement('video');
            video.controls = true;
            video.src = src;
            video.style.width = "400px";
            video.style.height = "300px";
            video.style.maxHeight = "60vh";
            video.style.maxWidth = "60vw";
            imgTd.parentNode.replaceChild(video, imgTd);
            popup._contentNode.classList.add('media');
            // Aggiorna il popup quando il video carica i metadati
            video.addEventListener('loadedmetadata', function () {
              popup.update();
            });
            setTimeout(function () {
              popup.setContent(tempDiv.innerHTML);
              popup.update();
            }, 10);
          } else {
            popup._contentNode.classList.remove('media');
          }
        } else {
          popup._contentNode.classList.remove('media');
        }
      }
      var zoomControl = L.control.zoom({
        position: 'topleft'
      }).addTo(map);
      var bounds_group = new L.featureGroup([]);
      function setBounds() {
      }

      function pop_bdt_region_geom_0(feature, layer) {

        layer.on('click', function () {
          // 🔄 RESET PROVINCE si une province était sélectionnée
          if (selectedLayerProvince) {
            selectedLayerProvince.setStyle(normalStyleProvince);
            selectedLayerProvince = null;
          }

          // 🔄 RESET ancienne région
          if (selectedLayerRegion) {
            selectedLayerRegion.setStyle(normalStyleRegion);
          }

          // ⭐ Sélection région
          layer.setStyle(selectedStyleRegion);

          selectedLayerRegion = layer;

          // ✅ ZOOM AUTOMATIQUE SUR LA RÉGION
          map.fitBounds(layer.getBounds(), {
            padding: [30, 30],
            animate: true,
            duration: 0.8,
            maxZoom: 12
          });

          window.parent.postMessage({
            action: 'showRegionInfo',
            nomFr: feature.properties['bdt_region_region_fr'],
            nomAr: feature.properties['bdt_region_region_ar'],
            chefLieu: feature.properties['bdt_region_chef_lieu']
          }, '*');

        });

      }


      function style_bdt_region_geom_0_0() {
        return {
          pane: 'pane_bdt_region_geom_0',
          opacity: 1,
          color: 'rgba(35,35,35,1.0)',
          dashArray: '',
          lineCap: 'butt',
          lineJoin: 'miter',
          weight: 1.0,
          fill: true,
          fillOpacity: 1,
          fillColor: 'rgba(243,164,87,1.0)',
          interactive: true,
        }
      }
      map.createPane('pane_bdt_region_geom_0');
      map.getPane('pane_bdt_region_geom_0').style.zIndex = 400;
      map.getPane('pane_bdt_region_geom_0').style['mix-blend-mode'] = 'normal';
      var layer_bdt_region_geom_0 = new L.geoJson(json_bdt_region_geom_0, {
        attribution: '',
        interactive: true,
        dataVar: 'json_bdt_region_geom_0',
        layerName: 'layer_bdt_region_geom_0',
        pane: 'pane_bdt_region_geom_0',
        onEachFeature: pop_bdt_region_geom_0,
        style: style_bdt_region_geom_0_0,
      });
      bounds_group.addLayer(layer_bdt_region_geom_0);
      map.addLayer(layer_bdt_region_geom_0);

      function pop_bdt_province_geom_1(feature, layer) {

        layer.on('click', function () {

          // 🔄 RESET REGION si une région était sélectionnée
          if (selectedLayerRegion) {
            selectedLayerRegion.setStyle(normalStyleRegion);
            selectedLayerRegion = null;
          }

          // 🔄 RESET ancienne province
          if (selectedLayerProvince) {
            selectedLayerProvince.setStyle(normalStyleProvince);
          }

          // ⭐ Sélection province
          layer.setStyle(selectedStyle);
          selectedLayerProvince = layer;

          // ✅ ZOOM AUTOMATIQUE SUR LA PROVINCE
          map.fitBounds(layer.getBounds(), {
            padding: [30, 30],
            animate: true,
            duration: 0.8,
            maxZoom: 11
          });
          // ✅ ENVOI DES DONNÉES AU DASHBOARD
          window.parent.postMessage({
            action: 'showProvinceInfo',
            nomFr: feature.properties['bdt_province_province_fr'],
            nomAr: feature.properties['bdt_province_province_ar']
          }, '*');

        });
      }


      function style_bdt_province_geom_1_0() {
        return {
          pane: 'pane_bdt_province_geom_1',
          opacity: 1,
          color: 'rgba(35,35,35,1.0)',
          dashArray: '',
          lineCap: 'butt',
          lineJoin: 'miter',
          weight: 1.0,
          fill: true,
          fillOpacity: 1,
          fillColor: 'rgba(212,212,212,1.0)',
          interactive: true,
        }
      }
      map.createPane('pane_bdt_province_geom_1');
      map.getPane('pane_bdt_province_geom_1').style.zIndex = 401;
      map.getPane('pane_bdt_province_geom_1').style['mix-blend-mode'] = 'normal';
      var layer_bdt_province_geom_1 = new L.geoJson(json_bdt_province_geom_1, {
        attribution: '',
        interactive: true,
        dataVar: 'json_bdt_province_geom_1',
        layerName: 'layer_bdt_province_geom_1',
        pane: 'pane_bdt_province_geom_1',
        onEachFeature: pop_bdt_province_geom_1,
        style: style_bdt_province_geom_1_0,
      });
      bounds_group.addLayer(layer_bdt_province_geom_1);
      map.addLayer(layer_bdt_province_geom_1);
      setBounds();
      var i = 0;
      layer_bdt_region_geom_0.eachLayer(function (layer) {
        var context = {
          feature: layer.feature,
          variables: {}
        };
        layer.bindTooltip((layer.feature.properties['bdt_region_region_fr'] !== null ? String('<div style="color: #323232; font-size: 10pt; font-family: \'Open Sans\', sans-serif;">' + layer.feature.properties['bdt_region_region_fr']) + '</div>' : ''), { permanent: true, offset: [-0, -16], className: 'css_bdt_region_geom_0' });
        labels.push(layer);
        totalMarkers += 1;
        layer.added = true;
        addLabel(layer, i);
        i++;
      });
      var i = 0;
      layer_bdt_province_geom_1.eachLayer(function (layer) {
        var context = {
          feature: layer.feature,
          variables: {}
        };
        layer.bindTooltip((layer.feature.properties['bdt_province_province_fr'] !== null ? String('<div style="color: #323232; font-size: 9pt; font-family: \'Open Sans\', sans-serif;">' + layer.feature.properties['bdt_province_province_fr']) + '</div>' : ''), { permanent: true, offset: [-0, -16], className: 'css_bdt_province_geom_1' });
        labels.push(layer);
        totalMarkers += 1;
        layer.added = true;
        addLabel(layer, i);
        i++;
      });
      resetLabels([layer_bdt_region_geom_0, layer_bdt_province_geom_1]);
      map.on("zoomend", function () {
        resetLabels([layer_bdt_region_geom_0, layer_bdt_province_geom_1]);
      });
      map.on("layeradd", function () {
        resetLabels([layer_bdt_region_geom_0, layer_bdt_province_geom_1]);
      });
      map.on("layerremove", function () {
        resetLabels([layer_bdt_region_geom_0, layer_bdt_province_geom_1]);
      });
    </script>
  </body>

</html>
