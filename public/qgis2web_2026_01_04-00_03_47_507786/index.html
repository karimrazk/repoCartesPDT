<!doctype html>
<html lang="en">

    <body>

        <script>
        var highlightLayer;
        function highlightFeature(e) {
            highlightLayer = e.target;

            if (e.target.feature.geometry.type === 'LineString' || e.target.feature.geometry.type === 'MultiLineString') {
              highlightLayer.setStyle({
                color: 'rgba(255, 255, 0, 1.00)',
              });
            } else {
              highlightLayer.setStyle({
                fillColor: 'rgba(255, 255, 0, 1.00)',
                fillOpacity: 1
              });
            }
            highlightLayer.openPopup();
        }
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:2
        }).fitBounds([[28.83907429881142,-10.036771544744486],[29.23174839368955,-9.394536504025133]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.update();
                    }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_GoogleSatellite_0');
        map.getPane('pane_GoogleSatellite_0').style.zIndex = 400;
        var layer_GoogleSatellite_0 = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            pane: 'pane_GoogleSatellite_0',
            opacity: 1.0,
            attribution: '',
            minZoom: 2,
            maxZoom: 28,
        });
        layer_GoogleSatellite_0;
        map.addLayer(layer_GoogleSatellite_0);
        function pop_bdt_commune_geom_1(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                    if (typeof layer.closePopup == 'function') {
                        layer.closePopup();
                    } else {
                        layer.eachLayer(function(feature){
                            feature.closePopup()
                        });
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['code_commune'] !== null ? autolinker.link(String(feature.properties['code_commune']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['bdt_commune_code_province'] !== null ? autolinker.link(String(feature.properties['bdt_commune_code_province']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['bdt_commune_code_caidat'] !== null ? autolinker.link(String(feature.properties['bdt_commune_code_caidat']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2"><strong>bdt_commune_commune_fr</strong><br />' + (feature.properties['bdt_commune_commune_fr'] !== null ? autolinker.link(String(feature.properties['bdt_commune_commune_fr']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['bdt_commune_commune_ar'] !== null ? autolinker.link(String(feature.properties['bdt_commune_commune_ar']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['bdt_commune_milieu'] !== null ? autolinker.link(String(feature.properties['bdt_commune_milieu']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['bdt_commune_code_lieu_siege_commune'] !== null ? autolinker.link(String(feature.properties['bdt_commune_code_lieu_siege_commune']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['bdt_commune_lieu_siege_commune'] !== null ? autolinker.link(String(feature.properties['bdt_commune_lieu_siege_commune']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['bdt_commune_lieu_siege_commune_statut'] !== null ? autolinker.link(String(feature.properties['bdt_commune_lieu_siege_commune_statut']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['bdt_commune_latitude_lieu_siege_commune'] !== null ? autolinker.link(String(feature.properties['bdt_commune_latitude_lieu_siege_commune']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['bdt_commune_longitude_lieu_siege_commune'] !== null ? autolinker.link(String(feature.properties['bdt_commune_longitude_lieu_siege_commune']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['bdt_commune_est_chef_lieu_cercle'] !== null ? autolinker.link(String(feature.properties['bdt_commune_est_chef_lieu_cercle']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['bdt_commune_est_chef_lieu_pachalik'] !== null ? autolinker.link(String(feature.properties['bdt_commune_est_chef_lieu_pachalik']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['bdt_commune_est_chef_lieu_caidat'] !== null ? autolinker.link(String(feature.properties['bdt_commune_est_chef_lieu_caidat']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['bdt_commune_localisation'] !== null ? autolinker.link(String(feature.properties['bdt_commune_localisation']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['bdt_commune_annee_creation'] !== null ? autolinker.link(String(feature.properties['bdt_commune_annee_creation']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['bdt_commune_emplacement_lieu_siege'] !== null ? autolinker.link(String(feature.properties['bdt_commune_emplacement_lieu_siege']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['bdt_commune_annee_changement_statut'] !== null ? autolinker.link(String(feature.properties['bdt_commune_annee_changement_statut']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['bdt_commune_dans_programme'] !== null ? autolinker.link(String(feature.properties['bdt_commune_dans_programme']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['bdt_commune_avec_perimetre_rural'] !== null ? autolinker.link(String(feature.properties['bdt_commune_avec_perimetre_rural']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['bdt_commune_origine'] !== null ? autolinker.link(String(feature.properties['bdt_commune_origine']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['bdt_commune_longitude_lieu_siege_pachalik'] !== null ? autolinker.link(String(feature.properties['bdt_commune_longitude_lieu_siege_pachalik']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['bdt_commune_latitude_lieu_siege_pachalik'] !== null ? autolinker.link(String(feature.properties['bdt_commune_latitude_lieu_siege_pachalik']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_bdt_commune_geom_1_0() {
            return {
                pane: 'pane_bdt_commune_geom_1',
                opacity: 1,
                color: 'rgba(0,255,11,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 2.0,
                fillOpacity: 0,
                interactive: false,
            }
        }
        function style_bdt_commune_geom_1_1() {
            return {
                pane: 'pane_bdt_commune_geom_1',
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(216,224,222,1.0)',
                interactive: false,
            }
        }
        map.createPane('pane_bdt_commune_geom_1');
        map.getPane('pane_bdt_commune_geom_1').style.zIndex = 401;
        map.getPane('pane_bdt_commune_geom_1').style['mix-blend-mode'] = 'normal';
        var layer_bdt_commune_geom_1 = new L.geoJson.multiStyle(json_bdt_commune_geom_1, {
            attribution: '',
            interactive: false,
            dataVar: 'json_bdt_commune_geom_1',
            layerName: 'layer_bdt_commune_geom_1',
            pane: 'pane_bdt_commune_geom_1',
            onEachFeature: pop_bdt_commune_geom_1,
            styles: [style_bdt_commune_geom_1_0,style_bdt_commune_geom_1_1,]
        });
        bounds_group.addLayer(layer_bdt_commune_geom_1);
        map.addLayer(layer_bdt_commune_geom_1);
        setBounds();
        var i = 0;
        layer_bdt_commune_geom_1.eachLayer(function(layer) {
            var context = {
                feature: layer.feature,
                variables: {}
            };
            layer.bindTooltip((layer.feature.properties['bdt_commune_commune_fr'] !== null?String('<div style="color: #000000; font-size: 10pt; font-family: \'Open Sans\', sans-serif;">' + layer.feature.properties['bdt_commune_commune_fr']) + '</div>':''), {permanent: true, offset: [-0, -16], className: 'css_bdt_commune_geom_1'});
            labels.push(layer);
            totalMarkers += 1;
              layer.added = true;
              addLabel(layer, i);
              i++;
        });
        resetLabels([layer_bdt_commune_geom_1]);
        map.on("zoomend", function(){
            resetLabels([layer_bdt_commune_geom_1]);
        });
        map.on("layeradd", function(){
            resetLabels([layer_bdt_commune_geom_1]);
        });
        map.on("layerremove", function(){
            resetLabels([layer_bdt_commune_geom_1]);
        });
        </script>
    </body>
